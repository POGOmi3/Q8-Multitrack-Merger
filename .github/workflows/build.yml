name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          if (Test-Path requirements.txt) { pip install -r requirements.txt }

      - name: Download FFmpeg (essentials build)
        shell: pwsh
        run: |
          $url = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg-dist
          $ffmpegExe = Get-ChildItem -Path ffmpeg-dist -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $ffmpegExe.FullName -Destination ./ffmpeg.exe
          ./ffmpeg.exe -version

      - name: Build with PyInstaller (onedir, FFmpeg同梱)
        shell: pwsh
        run: |
          pyinstaller --noconfirm --onedir --windowed `
            --name "Q8-Multitrack-Merger" `
            --add-binary "ffmpeg.exe;." `
            main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Q8-Multitrack-Merger-Windows
          path: dist/Q8-Multitrack-Merger/

      - name: Zip for Release (タグで実行したときのみ)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          Compress-Archive -Path dist/Q8-Multitrack-Merger -DestinationPath Q8-Multitrack-Merger-Windows.zip

      - name: Attach to Release (タグで実行したときのみ)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Q8-Multitrack-Merger-Windows.zip
